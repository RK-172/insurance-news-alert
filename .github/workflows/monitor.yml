name: Insurance news monitor
on:
  push:
    paths:
      - '.github/workflows/monitor.yml'
      - 'monitor.py'
      - 'preflight.py'
  schedule:
    # UTC: 06:00 <= Korea time < 21:00, every five minutes.
    - cron: '*/5 0-11,21-23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect = 수집 / test = 텔레그램 연결 시험'
        default: collect
        type: choice
        options: [collect, test]
permissions:
  contents: write
concurrency:
  group: insurance-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check operating hours before setup
        id: hours
        run: python3 preflight.py
      - name: Check notification configuration
        if: steps.hours.outputs.active == 'true'
        id: config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '설정 대기: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 확인 필요' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install parser
        if: steps.config.outputs.ready == 'true'
        run: pip install --quiet lxml==5.3.2
      - name: Regression tests for code changes
        if: steps.config.outputs.ready == 'true' && github.event_name != 'schedule'
        run: python -m unittest -q
      - name: Scan for new items and queue notifications
        id: scan
        if: steps.config.outputs.ready == 'true' && inputs.mode != 'test'
        run: python -u monitor.py --scan-only
      - name: Send queued notifications only when needed
        if: always() && steps.config.outputs.ready == 'true' && steps.scan.outputs.pending_count != '' && steps.scan.outputs.pending_count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u monitor.py --send-only
      - name: Test Telegram connection when explicitly requested
        if: steps.config.outputs.ready == 'true' && inputs.mode == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u monitor.py --test-message
      - name: Persist scan and delivery records
        if: always() && steps.scan.outcome != 'skipped' && steps.scan.outcome != ''
        run: |
          if [ -f state.json ]; then
            git config user.name 'insurance-alert-bot'
            git config user.email 'insurance-alert-bot@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record scan results and delivery queue'
              pushed=false
              for attempt in 1 2 3; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort
                  exit 1
                fi
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
              done
              if [ "$pushed" != true ]; then
                echo '수집 기록 저장 재시도 실패'
                exit 1
              fi
            fi
          fi
